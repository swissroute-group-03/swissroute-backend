server.port=${SERVER_PORT:8080}
spring.application.name=${SPRING_APPLICATION_NAME:swissroute-backend}
# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swissroute_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=swissroute
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=swissroute
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
# Disable automatic SQL init
spring.sql.init.mode=never
# Security JWT Configuration
security.jwt.key.private=${SECURITY_JWT_KEY_PRIVATE:dev-secret-key-group03-must-be-long-enough-to-be-secure}
security.jwt.user.generator=${SECURITY_JWT_USER_GENERATOR:AUTH0JWT-BACKEND-GROUP03}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:3600000}
# External APIs
transport.api.base-url=${TRANSPORT_API_BASE_URL:http://transport.opendata.ch/v1}