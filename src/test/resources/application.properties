spring.application.name=swissroute-backend-test

# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS SWISSROUTE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Security JWT properties for tests
security.jwt.key.private=test-secret-key-group03-must-be-long-enough-for-hmac256
security.jwt.user.generator=AUTH0JWT-BACKEND-TEST
security.jwt.expiration-ms=3600000

# Logging
logging.level.org.springframework.security=DEBUG

# Transport API
transport.api.base-url=http://transport.opendata.ch/v1
