spring.application.name=swissroute-backend-test

# PostgreSQL Configuration for Tests
# Reuses the same database as the development environment
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swissroute_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=swissroute

# Flyway Configuration for Tests
spring.flyway.enabled=true
spring.flyway.schemas=swissroute
# We disable cleaning to protect local development data. 
# @Transactional in tests will handle data isolation.
spring.flyway.clean-disabled=true

# Security JWT properties for tests
security.jwt.key.private=test-secret-key-group03-must-be-long-enough-for-hmac256
security.jwt.user.generator=AUTH0JWT-BACKEND-TEST
security.jwt.expiration-ms=3600000

# Logging
logging.level.org.springframework.security=DEBUG

# Transport API
transport.api.base-url=http://transport.opendata.ch/v1
